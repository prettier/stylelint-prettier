name: CI

on:
  pull_request: ~
  push:
    branches: [main]

jobs:
  ci:
    name: 'Test: Node ${{ matrix.node }} - Stylelint ${{ matrix.stylelint }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['26', '24', '22', '20']
        stylelint: ['17', '16', '16.0.0']
        include:
          - node: '18'
            stylelint: '16'
          - node: '18'
            stylelint: '16.0.0'

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node: ${{ matrix.node }}
          cache: pnpm

      - name: Use Stylelint ${{ matrix.stylelint }}
        run: pnpm upgrade stylelint@${{ matrix.stylelint }}

      - name: Install
        run: pnpm install

      - name: Test
        run: pnpm run test

      - name: Lint
        run: pnpm run lint
